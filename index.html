<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>PastureScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#F2F5F0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
    #root{min-height:100vh}
    button{font-family:inherit;cursor:pointer;border:none}
    input{font-family:inherit;border:none;outline:none}

    .screen-fwd{animation:slideFwd 300ms cubic-bezier(0.32,0.72,0,1) forwards}
    .screen-back{animation:slideBack 300ms cubic-bezier(0.32,0.72,0,1) forwards}
    .screen-up{animation:slideUp 340ms cubic-bezier(0.32,0.72,0,1) forwards}
    @keyframes slideFwd{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes slideBack{from{transform:translateX(-30%)}to{transform:translateX(0)}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

    #cam-video{width:100%;height:100%;object-fit:cover;display:block}
    .capture-wrap{position:relative;width:88px;height:88px;flex-shrink:0}
    .capture-svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
    .capture-circle{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.5);position:absolute;top:8px;left:8px;transition:transform .15s ease,background .15s ease}
    .capture-circle.rec{background:#EF4444;transform:scale(0.82)}
    .capture-hint{font-size:11px;color:rgba(255,255,255,0.75);text-align:center;margin-top:8px;font-weight:600;letter-spacing:.4px}

    .swipe-row{position:relative;overflow:hidden}
    .swipe-del{position:absolute;right:0;top:0;bottom:0;width:80px;background:#EF4444;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:#fff}
    .swipe-content{background:#fff;will-change:transform}

    @keyframes popIn{from{opacity:0;transform:scale(.7) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .pop-in{animation:popIn .5s cubic-bezier(0.34,1.56,0.64,1) forwards}

    @keyframes pulseRing{0%{transform:scale(1);opacity:.6}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
    .pulse-ring{position:absolute;inset:-6px;border-radius:50%;border:3px solid #fff;animation:pulseRing 1.4s ease-out infinite}

    @keyframes scanDrop{0%{top:8%}100%{top:88%}}
    .scan-line{position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,rgba(64,145,108,.9),transparent);animation:scanDrop 2s ease-in-out infinite alternate}

    @keyframes barGrow{from{width:0}to{width:var(--w)}}
    .dm-bar{animation:barGrow .8s .3s cubic-bezier(0.16,1,.3,1) both}

    body.sun{background:#fff}
    body.sun .card-bg{background:#f8f8f8 !important}

    @keyframes savePulse{0%{transform:scale(1)}50%{transform:scale(.97)}100%{transform:scale(1)}}
    .save-pulse{animation:savePulse .25s ease}

    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

    /* Bottom nav safe area */
    .has-nav{padding-bottom:80px}
  </style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#2D6A4F;font-size:17px;font-family:'Plus Jakarta Sans',sans-serif">Loading…</div></div>
<script type="module">

const store={

  trash:(s=18,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('polyline',{points:'3 6 5 6 21 6'}),h('path',{d:'M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2'})),

  info:(s=20,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('circle',{cx:12,cy:12,r:10}),h('line',{x1:12,y1:16,x2:12,y2:12}),h('line',{x1:12,y1:8,x2:'12.01',y2:8})),

  home:(s=22,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'}),h('polyline',{points:'9 22 9 12 15 12 15 22'})),
  clock:(s=22,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('circle',{cx:12,cy:12,r:10}),h('polyline',{points:'12 6 12 12 16 14'})),
  user:(s=22,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'}),h('circle',{cx:12,cy:7,r:4})),
  edit:(s=16,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'}),h('path',{d:'M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'})),
  share:(s=18,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('circle',{cx:18,cy:5,r:3}),h('circle',{cx:6,cy:12,r:3}),h('circle',{cx:18,cy:19,r:3}),h('line',{x1:'8.59',y1:'13.51',x2:'15.42',y2:'17.49'}),h('line',{x1:'15.41',y1:'6.51',x2:'8.59',y2:'10.49'})),
  download:(s=18,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'7 10 12 15 17 10'}),h('line',{x1:12,y1:15,x2:12,y2:3})),
  logout:(s=18,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4'}),h('polyline',{points:'16 17 21 12 16 7'}),h('line',{x1:21,y1:12,x2:9,y2:12})),
  importIcon:(s=18,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),h('polyline',{points:'17 8 12 3 7 8'}),h('line',{x1:12,y1:3,x2:12,y2:15})),
  chevron:(s=16,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'},h('polyline',{points:'9 18 15 12 9 6'})),
  menu:(s=20,col='currentColor')=>h('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:col,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},h('line',{x1:3,y1:12,x2:21,y2:12}),h('line',{x1:3,y1:6,x2:21,y2:6}),h('line',{x1:3,y1:18,x2:21,y2:18})),
};

// ─── DM Gauge ────────────────────────────────────────────────────────────────
function DmGauge({value}){
  const zones=[{min:300,max:1500,color:'#EF4444'},{min:1500,max:2200,color:'#F97316'},{min:2200,max:3200,color:'#2D6A4F'},{min:3200,max:5500,color:'#D97706'}];
  const total=5500-300;
  const markerPct=Math.min(97,Math.max(3,(value-300)/total*100));
  const cat=getCat(value);
  return h('div',{style:{marginBottom:24}},
    h('div',{style:{position:'relative',marginBottom:10}},
      h('div',{style:{display:'flex',borderRadius:10,overflow:'hidden',height:10}},
        zones.map((z,i)=>h('div',{key:i,style:{flex:(z.max-z.min)/total,background:z.color,opacity:.85}}))
      ),
      h('div',{style:{position:'absolute',top:-3,left:`${markerPct}%`,transform:'translateX(-50%)',width:16,height:16,borderRadius:8,background:cat.color,border:'2.5px solid #fff',boxShadow:`0 0 0 2px ${cat.color}55`}})
    ),
    h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:10,color:C.textTert,fontWeight:600,letterSpacing:.3}},
      ['300','1,500','2,200','3,200','5,500+'].map((v,i)=>h('span',{key:i},v))
    )
  );
}

// ─── Seasons / DM ranges ─────────────────────────────────────────────────────
const SEASONS=[
  {label:'Spring',months:[8,9,10]},
  {label:'Summer',months:[11,0,1]},
  {label:'Autumn',months:[2,3,4]},
  {label:'Winter',months:[5,6,7]},
];
const getSeason=()=>{
  const m=new Date().getMonth();
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  const south=/Auckland|Wellington|Sydney|Melbourne|Brisbane|Adelaide|Hobart|Perth/.test(tz)||new Date().getTimezoneOffset()<=-480;
  const mo=south?m:(m+6)%12;
  return SEASONS.find(s=>s.months.includes(mo))||SEASONS[0];
};

const DM=[
  {label:'Below residual',sub:'Overgrazed', min:300, max:1500,color:'#EF4444',dot:'#EF4444',tip:'Rest immediately — tiller damage risk'},
  {label:'Building',      sub:'Resting',   min:1500,max:2200,color:'#F97316',dot:'#F97316',tip:'Continue resting — not ready to graze'},
  {label:'Pre-grazing',   sub:'Ideal',     min:2200,max:3200,color:'#2D6A4F',dot:'#2D6A4F',tip:'2,800–3,200 kg DM/ha — 16–18 kg DM/cow/day'},
  {label:'Surplus',       sub:'Act now',   min:3200,max:5500,color:'#D97706',dot:'#D97706',tip:'Quality declining — ensile or graze immediately'},
];
const getCat=dm=>DM.find(r=>dm>=r.min&&dm<r.max)||DM[3];

// ─── Pixel analysis (unchanged) ──────────────────────────────────────────────
function analysePixels(dataUrl){return new Promise(resolve=>{
  const img=new Image();
  img.onload=()=>{
    const S=240,c=document.createElement('canvas');c.width=S;c.height=S;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,S,S);
    const px=ctx.getImageData(0,0,S,S).data,n=S*S;
    let rS=0,gS=0,bS=0,exS=0,gcS=0,ngS=0;
    let dG=0,rG=0,mG=0,lG=0,pG=0,yG=0,br=0,sh=0,gr=0,wh=0;
    let glS=0,gc2=0,gn=0;
    for(let i=0;i<px.length;i+=4){
      const r=px[i],g=px[i+1],b=px[i+2];
      const lum=.299*r+.587*g+.114*b,sat=Math.max(r,g,b)-Math.min(r,g,b),s3=r+g+b+.001;
      rS+=r;gS+=g;bS+=b;
      const exG=2*g-r-b,gcc=g/s3,ng=(g-r)/(g+r+.001);
      exS+=exG;gcS+=gcc;ngS+=ng;
      const mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
      let hue=0;if(d>0){if(mx===r)hue=((g-b)/d)%6;else if(mx===g)hue=(b-r)/d+2;else hue=(r-g)/d+4;hue*=60;if(hue<0)hue+=360;}
      if(lum>238){wh++;continue;}
      if(sat<16&&lum>50&&lum<215){gr++;continue;}
      if(lum<32){sh++;continue;}
      const isGH=hue>=55&&hue<=170,isGD=g>r&&g>b&&exG>5;
      if(isGH||isGD){
        glS+=lum;gc2+=lum*lum;gn++;
        if(lum<110&&exG>35&&hue>=80&&hue<=150&&sat>30){dG++;continue;}
        if(lum>=90&&lum<150&&exG>25&&hue>=75&&hue<=155&&sat>22){rG++;continue;}
        if(lum>=125&&lum<185&&exG>12&&hue>=70&&hue<=160&&sat>14){mG++;continue;}
        if(lum>=165&&lum<225&&hue>=65&&hue<=160&&sat>10){lG++;continue;}
        if(lum>=200&&exG>3&&sat>6){pG++;continue;}
        if(hue>=40&&hue<75&&lum>100&&sat>15){yG++;continue;}
      }
      if(hue>=15&&hue<50&&r>g&&r>b&&lum>38&&lum<195&&sat>8){br++;}
    }
    const [dP,rP,mP,lP,pP,yP,bP,dkP,grP,whP]=[dG,rG,mG,lG,pG,yG,br,sh,gr,wh].map(v=>v/n);
    const gt=dP+rP+mP+lP+pP+yP;
    const [aR,aG,aB]=[rS,gS,bS].map(v=>v/n);
    const aEx=exS/n,aGC=gcS/n,aNg=ngS/n;
    const p1=gt>=.12&&(aEx>6||aGC>.36),p2=dkP>.15&&aG>aR&&aG>aB*.95,p3=aG-aR>3&&aGC>.33&&grP+whP<.30;
    if(!p1&&!p2&&!p3){resolve({grassDetected:false,grassPct:Math.round(gt*100)});return;}
    const gMn=gn?glS/gn:0,gStd=Math.sqrt(Math.max(0,gn?(gc2/gn)-gMn*gMn:0));
    const uni=Math.max(0,1-gStd/60);
    const isLawn=mP>.28&&dP<.08&&dkP<.06&&bP<.08&&uni>.45&&aGC>.36;
    const isFes=!isLawn&&dP>.15&&dkP>.08&&rP>.15&&lP<.12;
    const isKik=!isLawn&&lP>.25&&dP<.10&&mP>.20&&yP<.15;
    const sw=isLawn?'lawn':isFes?'fescue':isKik?'kikuyu':'ryegrass';
    let vh;
    if(isLawn)vh=2+mP*5+lP*6+yP*4+pP*3;
    else if(isKik)vh=3+dP*20+rP*14+mP*9+lP*6+yP*5+dkP*9;
    else{const sg=.5+Math.min(1,dkP/.10)*.5;vh=(dP*28+rP*17)*sg+mP*11+lP*5+pP*3+yP*7+dkP*13+bP+Math.max(0,aG-aR)/5;}
    const hCm=Math.max(2,Math.min(40,Math.round(vh)));
    const cR=isLawn?1.5:isFes?3.0:isKik?3.2:2.7;
    const cCm=Math.max(.3,hCm/cR);
    const clover=!isLawn&&lP>.08&&yP<.22&&rP>.08;
    const pg=hCm<=8||(bP>.18&&hCm<12);
    const leaf=isLawn?'Mown':hCm<=6?'Residual':hCm<=10?'1.0':hCm<=14?'1.5–2.0':hCm<=18?'2.0–2.5':hCm<=24?'2.5–3.0':'3.0+';
    const dv=dP+rP;
    const qual=isLawn?'Lawn':(dv>.45&&bP<.08&&yP<.12)?'High':(dv>.22||mP>.32)?'Medium':'Low';
    const gr2=isLawn?0:Math.max(15,Math.min(180,Math.round(40+dP*170+rP*95+mP*40-yP*55-bP*35)));
    const conf=(gt>.60&&aEx>25&&gStd<35)?'high':(gt>.35&&aEx>12)?'medium':'low';
    resolve({grassDetected:true,sw,isLawn,hCm,cCm,qual,leaf,clover,pg,greenPct:Math.round(gt*100),brownPct:Math.round(bP*100),dP,rP,mP,lP,yP,dkP,aEx,aGC,aNg,uni:Math.round(uni*100)/100,gr:gr2,conf});
  };
  img.onerror=()=>resolve({grassDetected:false,grassPct:0});
  img.src=dataUrl;
});}

function computeResult(s,season){
  const{hCm,cCm,qual,leaf,clover,pg,isLawn,sw,greenPct,brownPct,dP,rP,yP,aNg,gr,conf,uni}=s;
  const bK=sw==='lawn'?170:sw==='fescue'?260:sw==='kikuyu'?230:280;
  const sF=season.label==='Winter'?.90:season.label==='Summer'?1.05:1;
  let kg=cCm*bK*sF+(isLawn?200:500);
  const adj=isLawn?0:(dP*400+rP*180)+(yP*-380)+(brownPct/100*-320)+(clover?60:0);
  kg+=Math.max(-kg*.15,Math.min(kg*.15,adj));
  if(!isLawn){
    const nb=Math.max(0,aNg)*6000+500,gc=Math.max(.6,Math.min(1.15,(greenPct/100)/.75));
    kg=kg*.35+nb*gc*.65-yP*400-(brownPct/100)*350+(clover?80:0);
  }
  kg=Math.round(Math.max(isLawn?200:500,Math.min(5500,kg)));
  const sp=sw==='fescue'?'Tall fescue: ':sw==='kikuyu'?'Kikuyu: ':'';
  let notes,rec;
  if(isLawn){notes=`Lawn detected (~${hCm} cm, ${greenPct}% green). DM equivalent ~${kg.toLocaleString()} kg DM/ha.`;rec='For dairy readings, photograph farm paddocks from 1 m height.';}
  else if(kg<1500){notes=`${sp}${kg<1000?'Severely overgrazed':'Below residual'} at ~${hCm} cm (${cCm.toFixed(1)} cm compressed), ${greenPct}% green. DairyNZ target is 1,500–1,650 kg DM/ha post-graze.`;rec=kg<1000?'Critical — remove stock immediately. Rest 18–20 days minimum.':'Remove cows now. Target 1,500–1,650 kg DM/ha residuals.';}
  else if(kg<2000){const d=Math.round((2500-kg)/Math.max(gr,20));notes=`${sp}Rebuilding at ~${hCm} cm, ${greenPct}% green. At ${kg.toLocaleString()} kg DM/ha — estimated ${d} days to pre-grazing target.`;rec='Continue resting — not ready to graze. Target 2,200 kg DM/ha minimum.';}
  else if(kg<2800){notes=`${sp}Good ${season.label.toLowerCase()} cover, ${leaf} leaf, ${greenPct}% green.${clover?' Clover present.':''}`;rec=kg<2400?'Almost ready — graze in 3–5 days.':clover?'Ideal ryegrass/clover. Graze within 1–2 days. Target 1,500–1,650 residual.':'Good cover — graze within 2–3 days. Target 1,500–1,650 residual.';}
  else if(kg<3500){notes=`${sp}Pre-grazing ${kg.toLocaleString()} kg DM/ha at ${hCm} cm — ideal for 16–18 kg DM/cow/day.`;rec=clover?'Peak quality. Graze immediately, target 1,500–1,650 residual.':'Graze immediately — above 3,200 risks quality loss.';}
  else{notes=`${sp}Surplus at ${hCm} cm (${kg.toLocaleString()} kg DM/ha) — above 3,500 threshold. Quality deteriorating.`;rec='Act immediately — ensile or allocate to highest-producing cows.';}
  return{kgDMperHa:kg,hCm,conf,qual,leaf,clover,pg,isLawn,sw,notes,rec,gr};
}

function aggregateFrames(arr){
  const v=arr.filter(s=>s&&s.grassDetected);
  if(!v.length)return{grassDetected:false,grassPct:(arr.find(s=>s)||{grassPct:0}).grassPct};
  const avg=k=>v.reduce((s,x)=>s+(x[k]||0),0)/v.length;
  const med=k=>{const so=v.map(x=>x[k]||0).sort((a,b)=>a-b),m=Math.floor(so.length/2);return so.length%2?so[m]:(so[m-1]+so[m])/2;};
  const mode=k=>{const co={};v.forEach(x=>{co[x[k]]=(co[x[k]]||0)+1;});return Object.keys(co).reduce((a,b)=>co[a]>co[b]?a:b);};
  const hs=v.map(x=>x.hCm),hm=hs.reduce((s,x)=>s+x,0)/hs.length;
  const hSt=Math.sqrt(hs.reduce((s,x)=>s+(x-hm)**2,0)/hs.length);
  const vp=hSt>4?1:hSt>2?2:3,ct=v.reduce((s,x)=>s+(x.conf==='high'?3:x.conf==='medium'?2:1),0)/v.length;
  const fc=Math.min(ct,vp);
  return{grassDetected:true,sw:mode('sw'),isLawn:v.filter(x=>x.isLawn).length>v.length/2,hCm:Math.round(med('hCm')),cCm:med('hCm')/2.7,qual:mode('qual'),leaf:mode('leaf'),clover:v.filter(x=>x.clover).length>v.length/2,pg:v.filter(x=>x.pg).length>v.length/2,greenPct:Math.round(avg('greenPct')),brownPct:Math.round(avg('brownPct')),dP:avg('dP'),rP:avg('rP'),mP:avg('mP'),lP:avg('lP'),yP:avg('yP'),dkP:avg('dkP'),aEx:avg('aEx'),aGC:avg('aGC'),aNg:avg('aNg'),uni:avg('uni'),gr:Math.round(avg('gr')),conf:fc>=2.5?'high':fc>=1.5?'medium':'low',frames:v.length,hSt:Math.round(hSt*10)/10,spatVar:hSt>4?'high':hSt>2?'moderate':'low'};
}

function useCountUp(target,dur=1100){
  const[val,setVal]=useState(0);
  useEffect(()=>{
    let t0=null;
    const tick=ts=>{if(!t0)t0=ts;const p=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-p,3);setVal(Math.round(e*target));if(p<1)requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  },[target]);
  return val;
}

// ─── Swipeable history card ───────────────────────────────────────────────────
function SwipeCard({children,onDelete,onClick}){
  const[tx,setTx]=useState(0),[open,setOpen]=useState(false);
  const sx=useRef(0),drag=useRef(false),moved=useRef(false);
  const start=e=>{sx.current=e.touches[0].clientX;drag.current=true;moved.current=false;};
  const move=e=>{if(!drag.current)return;const dx=e.touches[0].clientX-sx.current;if(Math.abs(dx)>4)moved.current=true;if(dx<0)setTx(Math.max(open?dx-80:dx,-80));};
  const end=()=>{drag.current=false;if(tx<-45){setTx(-80);setOpen(true);}else{setTx(0);setOpen(false);}};
  const tap=()=>{if(moved.current)return;if(open){setTx(0);setOpen(false);}else onClick&&onClick();};
  return h('div',{className:'swipe-row',style:{marginBottom:8}},
    h('div',{className:'swipe-del',onClick:()=>{setTx(0);setOpen(false);onDelete&&onDelete();}},
      Ic.trash(18,'#fff'),h('div',{style:{fontSize:10,fontWeight:700,marginTop:2}},'Delete')),
    h('div',{className:'swipe-content',style:{transform:`translateX(${tx}px)`,transition:drag.current?'none':'transform .2s ease',borderRadius:16,overflow:'hidden',boxShadow:C.shadow},
      onTouchStart:start,onTouchMove:move,onTouchEnd:end,onClick:tap},children)
  );
}

  const[isRecording,setIsRecording]=useState(false);
  const[recTime,setRecTime]=useState(0);
  const holdTimer=useRef(null);
  const framesRef=useRef([]);
  const frameInterval=useRef(null);
  const MAX_REC=10000;
  const CIRCUMFERENCE=2*Math.PI*36;

  useEffect(()=>{
    let active=true;
    navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false})
      .then(stream=>{if(!active)return;streamRef.current=stream;if(videoRef.current){videoRef.current.srcObject=stream;videoRef.current.play().then(()=>setReady(true)).catch(()=>setReady(true));}})
      .catch(err=>{if(!active)return;setError(err.name==='NotAllowedError'?'Camera permission denied. Please allow camera access in Settings.':'Camera not available on this device.');});
    return()=>{active=false;streamRef.current?.getTracks().forEach(t=>t.stop());};
  },[]);

  useEffect(()=>{
    if(!isRecording){setRecTime(0);return;}
    const t=setInterval(()=>setRecTime(p=>{if(p>=MAX_REC){finishCapture();return 0;}return p+80;}),80);
    return()=>clearInterval(t);
  },[isRecording]);

  const captureFrame=()=>{
    const v=videoRef.current;if(!v||v.videoWidth===0)return null;
    const c=document.createElement('canvas'),sc=480/v.videoWidth;
    c.width=480;c.height=Math.round(v.videoHeight*sc);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',.88);
  };

  const finishCapture=()=>{
    clearInterval(frameInterval.current);
    const frames=[...framesRef.current];
    framesRef.current=[];
    setIsRecording(false);
    if(!frames.length){const f=captureFrame();if(f)onCapture([f],f);}
    else onCapture(frames,frames[Math.floor(frames.length/2)]);
  };

  const onPressStart=e=>{
    e.preventDefault();
    framesRef.current=[];
    holdTimer.current=setTimeout(()=>{
      setIsRecording(true);
      framesRef.current=[];
      frameInterval.current=setInterval(()=>{const f=captureFrame();if(f)framesRef.current.push(f);},220);
    },200);
  };

  const onPressEnd=e=>{
    e.preventDefault();
    if(holdTimer.current){clearTimeout(holdTimer.current);holdTimer.current=null;}
    if(isRecording){finishCapture();}
    else{const f=captureFrame();if(f)onCapture([f],f);}
  };

  const progress=recTime/MAX_REC;
  const dashOffset=CIRCUMFERENCE*(1-progress);

  if(error)return h('div',{style:{background:'#000',minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,gap:20}},
    h('div',{style:{color:'rgba(255,255,255,.4)'}},Ic.camera(56,'rgba(255,255,255,.4)')),
    h('div',{style:{fontSize:15,color:'rgba(255,255,255,.8)',textAlign:'center',lineHeight:1.7,fontWeight:500}},error),
    h('label',{style:{background:C.green,borderRadius:14,padding:'14px 28px',color:'#fff',fontSize:15,fontWeight:700,fontFamily:'inherit',marginTop:8,display:'flex',alignItems:'center',gap:8,cursor:'pointer'}},
      h('input',{type:'file',accept:'video/*,image/*',style:{position:'absolute',opacity:0,width:0,height:0},onChange:onFileSelected}),
      Ic.upload(18,'#fff'),'Upload from Photos'
    ),
    h('button',{onClick:onBack,style:{background:'transparent',borderRadius:14,padding:'12px 28px',color:'rgba(255,255,255,.4)',fontSize:14,fontWeight:500,fontFamily:'inherit'}},'Go Back')
  );

  return h('div',{style:{background:'#000',minHeight:'100vh',maxWidth:430,margin:'0 auto',position:'relative',overflow:'hidden'}},
    h('video',{ref:videoRef,muted:true,playsInline:true,autoPlay:true,style:{width:'100%',height:'100%',objectFit:'cover',position:'absolute',inset:0}}),
    h('div',{style:{position:'absolute',top:0,left:0,right:0,height:150,background:'linear-gradient(to bottom,rgba(0,0,0,.65),transparent)',pointerEvents:'none'}}),
    h('div',{style:{position:'absolute',bottom:0,left:0,right:0,height:220,background:'linear-gradient(to top,rgba(0,0,0,.8),transparent)',pointerEvents:'none'}}),
    // Top bar
    h('div',{style:{position:'absolute',top:0,left:0,right:0,padding:'52px 20px 0',display:'flex',alignItems:'center',gap:12}},
      h('button',{onClick:onBack,style:{width:42,height:42,background:'rgba(0,0,0,.4)',backdropFilter:'blur(10px)',borderRadius:21,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},Ic.back(18,'#fff')),
      h('input',{value:paddockName,onChange:e=>setPaddockName(e.target.value),placeholder:'Paddock name (optional)',style:{flex:1,background:'rgba(0,0,0,.35)',backdropFilter:'blur(10px)',borderRadius:22,padding:'10px 18px',color:'#fff',fontSize:15,fontWeight:500,fontFamily:'inherit'}})
    ),
    // Corner guides
    !isRecording&&ready&&h('div',{style:{position:'absolute',inset:'25%',pointerEvents:'none'}},
      ...[{top:0,left:0,borderTop:'2px solid rgba(255,255,255,.55)',borderLeft:'2px solid rgba(255,255,255,.55)'},{top:0,right:0,borderTop:'2px solid rgba(255,255,255,.55)',borderRight:'2px solid rgba(255,255,255,.55)'},{bottom:0,left:0,borderBottom:'2px solid rgba(255,255,255,.55)',borderLeft:'2px solid rgba(255,255,255,.55)'},{bottom:0,right:0,borderBottom:'2px solid rgba(255,255,255,.55)',borderRight:'2px solid rgba(255,255,255,.55)'}].map((s,i)=>
        h('div',{key:i,style:{position:'absolute',width:24,height:24,...s}})
      )
    ),
    // Recording indicator
    isRecording&&h('div',{style:{position:'absolute',top:110,left:0,right:0,display:'flex',alignItems:'center',justifyContent:'center',gap:8}},
      h('div',{style:{width:8,height:8,borderRadius:4,background:'#EF4444',boxShadow:'0 0 8px #EF4444'}}),
      h('div',{style:{color:'#fff',fontSize:13,fontWeight:700,letterSpacing:.8}},'RECORDING · SWEEP SLOWLY')
    ),
    // Bottom controls
    h('div',{style:{position:'absolute',bottom:0,left:0,right:0,padding:'0 0 52px',display:'flex',flexDirection:'column',alignItems:'center',gap:16}},
      h('div',{className:'capture-hint'},isRecording?'Release to analyse':'Tap for photo · Hold for video sweep'),
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:44,width:'100%'}},
        h('label',{style:{width:48,height:48,background:'rgba(255,255,255,.12)',backdropFilter:'blur(8px)',borderRadius:24,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}},
          h('input',{type:'file',accept:'video/*,image/*',style:{position:'absolute',opacity:0,width:0,height:0},onChange:onFileSelected}),
          Ic.upload(20,'#fff')
        ),
        h('div',{className:'capture-wrap',
          onPointerDown:onPressStart,onPointerUp:onPressEnd,onPointerLeave:e=>{if(isRecording||holdTimer.current)onPressEnd(e);},
          style:{touchAction:'none',userSelect:'none'}},
          h('svg',{className:'capture-svg',width:88,height:88,viewBox:'0 0 88 88'},
            h('circle',{cx:44,cy:44,r:36,fill:'none',stroke:'rgba(255,255,255,.2)',strokeWidth:6}),
            isRecording&&h('circle',{cx:44,cy:44,r:36,fill:'none',stroke:'#EF4444',strokeWidth:6,strokeDasharray:CIRCUMFERENCE,strokeDashoffset:dashOffset,strokeLinecap:'round',style:{transition:'stroke-dashoffset .08s linear'}})
          ),
          !isRecording&&h('div',{className:'pulse-ring'}),
          h('div',{className:'capture-circle'+(isRecording?' rec':'')})
        ),
        h('div',{style:{width:48,height:48}})
      )
    ),
    !ready&&!error&&h('div',{style:{position:'absolute',inset:0,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14}},
      h('div',{style:{width:36,height:36,border:'3px solid rgba(255,255,255,.15)',borderTopColor:'#fff',borderRadius:18,animation:'spin .8s linear infinite'}}),
      h('div',{style:{color:'rgba(255,255,255,.5)',fontSize:14,fontWeight:500}},'Starting camera…')
    )
  );
}

// ─── Save Modal ───────────────────────────────────────────────────────────────
function SaveModal({onConfirm,onCancel}){
  const [paddock,setPaddock]=useState('');
  const [graze,setGraze]=useState('post');
  return h('div',{style:{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end',background:'rgba(0,0,0,.6)',backdropFilter:'blur(6px)'}},
    h('div',{style:{background:'#fff',borderRadius:'28px 28px 0 0',padding:'8px 24px 44px',animation:'slideUp .28s cubic-bezier(0.32,0.72,0,1)'}},
      h('div',{style:{width:40,height:4,background:'#E2EBE5',borderRadius:2,margin:'12px auto 24px'}}),
      h('div',{style:{fontSize:20,fontWeight:800,color:C.text,marginBottom:24}},'Save Reading'),
      h('div',{style:{marginBottom:18}},
        h('label',{style:{fontSize:11,fontWeight:700,color:C.textSec,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:8}},'Paddock Number / Name'),
        h('input',{value:paddock,onChange:e=>setPaddock(e.target.value),placeholder:'e.g. Paddock 4, Home Block…',autoFocus:true,style:{width:'100%',fontSize:16,fontWeight:500,padding:'13px 16px',border:`1.5px solid ${C.border}`,borderRadius:14,boxSizing:'border-box',outline:'none',color:C.text,fontFamily:'inherit'}})
      ),
      h('div',{style:{marginBottom:28}},
        h('label',{style:{fontSize:11,fontWeight:700,color:C.textSec,textTransform:'uppercase',letterSpacing:.8,display:'block',marginBottom:8}},'Grazing Status'),
        h('div',{style:{display:'flex',gap:10}},
          ['pre','post'].map(g=>
            h('button',{key:g,onClick:()=>setGraze(g),style:{flex:1,padding:'13px 0',borderRadius:14,fontSize:15,fontWeight:700,border:`2px solid ${graze===g?C.green:C.border}`,background:graze===g?C.green:'#F8FAF8',color:graze===g?'#fff':C.textSec,transition:'all .15s',fontFamily:'inherit'}},
              g==='pre'?'Pre-grazing':'Post-grazing'
            )
          )
        )
      ),
      h('button',{onClick:()=>onConfirm(paddock,graze),style:{width:'100%',background:C.green,borderRadius:16,padding:17,color:'#fff',fontSize:17,fontWeight:800,marginBottom:10,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:10,boxShadow:`0 6px 20px ${C.green}44`}},Ic.check(20,'#fff'),'Save Reading'),
      h('button',{onClick:onCancel,style:{width:'100%',background:'transparent',borderRadius:16,padding:14,color:C.textSec,fontSize:15,fontWeight:600,fontFamily:'inherit'}},'Cancel')
    )
  );
}

// ─── Result Screen ────────────────────────────────────────────────────────────
function ResultScreen({result,capturedImg,paddockName,setPaddockName,season,activeTab,setActiveTab,onSave,onRetake,onBack,dir}){
  const [showSaveModal,setShowSaveModal]=useState(false);
  const cat=getCat(result.kgDMperHa);
  const cowDays=Math.round(result.kgDMperHa/17);
  const displayNum=useCountUp(result.kgDMperHa);

  return h('div',{className:`screen-${dir}`,style:{position:'relative',width:'100%',height:'100vh',maxWidth:430,margin:'0 auto',overflow:'hidden',background:`linear-gradient(160deg,${cat.color}dd,${cat.color}99)`}},
    // Full-screen grass background
    capturedImg&&h('img',{src:capturedImg,style:{width:'100%',height:'100%',objectFit:'cover',position:'absolute',inset:0}}),
    // Dark overlay
    h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.8) 100%)'}}),
    // Back button
    h('button',{onClick:onBack,style:{position:'absolute',top:54,left:18,width:42,height:42,background:'rgba(0,0,0,.3)',backdropFilter:'blur(10px)',borderRadius:21,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',zIndex:2}},Ic.back(18,'#fff')),
    // Cover info — vertically centred
    h('div',{style:{position:'absolute',top:'30%',left:22,right:22,zIndex:2}},
      h('div',{style:{fontSize:11,color:'rgba(255,255,255,.7)',fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,marginBottom:6}},'Pasture Cover'),
      h('div',{className:'pop-in',style:{display:'flex',alignItems:'baseline',gap:10,marginBottom:16}},
        h('div',{style:{fontSize:72,fontWeight:900,color:'#fff',letterSpacing:'-3px',lineHeight:1}},displayNum.toLocaleString()),
        h('div',{style:{fontSize:18,color:'rgba(255,255,255,.75)',fontWeight:700}},'kg DM/ha')
      ),
      h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
        h('div',{style:{background:'rgba(0,0,0,.3)',backdropFilter:'blur(6px)',borderRadius:20,padding:'6px 16px'}},h('div',{style:{fontSize:13,color:'#fff',fontWeight:700}},cat.label)),
        h('div',{style:{background:'rgba(0,0,0,.25)',backdropFilter:'blur(6px)',borderRadius:20,padding:'6px 14px'}},h('div',{style:{fontSize:13,color:'rgba(255,255,255,.9)',fontWeight:600}},result.conf.toUpperCase())),
        result.isVideo&&h('div',{style:{background:'rgba(0,0,0,.2)',backdropFilter:'blur(6px)',borderRadius:20,padding:'6px 12px',display:'flex',alignItems:'center',gap:6}},Ic.film(12,'rgba(255,255,255,.9)'),h('div',{style:{fontSize:12,color:'rgba(255,255,255,.9)',fontWeight:600}},result.framesAnalysed+' frames'))
      )
    ),
    // Buttons pinned to bottom
    h('div',{style:{position:'absolute',bottom:0,left:0,right:0,padding:'0 20px 44px',zIndex:2}},
      h('button',{onClick:()=>setShowSaveModal(true),style:{width:'100%',background:C.green,borderRadius:16,padding:18,color:'#fff',fontSize:17,fontWeight:800,boxShadow:`0 8px 28px ${C.green}66`,marginBottom:12,display:'flex',alignItems:'center',justifyContent:'center',gap:10,letterSpacing:'-.2px',fontFamily:'inherit'}},Ic.check(20,'#fff'),'Save Reading'),
      h('button',{onClick:onRetake,style:{width:'100%',background:'rgba(255,255,255,.15)',backdropFilter:'blur(10px)',border:'1.5px solid rgba(255,255,255,.3)',borderRadius:16,padding:15,color:'#fff',fontSize:15,fontWeight:600,fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:8}},Ic.camera(18,'#fff'),'Take Another')
    ),
    showSaveModal&&h(SaveModal,{onConfirm:(paddock,graze)=>{setShowSaveModal(false);onSave(paddock,graze);},onCancel:()=>setShowSaveModal(false)})
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
