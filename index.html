// ── Storage shim ──────────────────────────────────────────────────────────────
window._storage = {
  get: k => { const v = localStorage.getItem(k); return v ? { value: v } : null; },
  set: (k, v) => localStorage.setItem(k, v),
};

// ── Seasons ───────────────────────────────────────────────────────────────────
const SEASONS = [
  { label:'Spring', months:[8,9,10] },
  { label:'Summer', months:[11,0,1] },
  { label:'Autumn', months:[2,3,4]  },
  { label:'Winter', months:[5,6,7]  },
];
function getCurrentSeason() {
  const m = new Date().getMonth();
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const isSouthern = /Auckland|Wellington|Sydney|Melbourne|Brisbane|Adelaide|Hobart|Perth/.test(tz)
    || new Date().getTimezoneOffset() <= -480;
  const month = isSouthern ? m : (m + 6) % 12;
  return SEASONS.find(s => s.months.includes(month)) || SEASONS[0];
}

// ── DairyNZ targets ───────────────────────────────────────────────────────────
const DM_RANGES = [
  { label:'Below residual',    min:300,  max:1500, color:'#ef4444', emoji:'🔴', target:'DairyNZ residual target: 1,500–1,650 kg DM/ha (3.5–4 cm, 7–8 clicks)' },
  { label:'Building — resting',min:1500, max:2200, color:'#f97316', emoji:'🟠', target:'Below 2,000–2,400 APC target — continue resting' },
  { label:'Pre-grazing ready', min:2200, max:3200, color:'#22c55e', emoji:'🟢', target:'Ideal 2,800–3,200 kg DM/ha for 16–18 kg DM/cow/day' },
  { label:'Surplus',           min:3200, max:5000, color:'#eab308', emoji:'🟡', target:'>3,500 = clover shading, tiller loss, ensile or top-priority graze' },
];
const getDMCat = dm => DM_RANGES.find(r => dm >= r.min && dm < r.max) || DM_RANGES[3];

// ── Pixel analysis ────────────────────────────────────────────────────────────
function analysePixels(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 240;
      const c = document.createElement('canvas');
      c.width = SIZE; c.height = SIZE;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, SIZE, SIZE);
      const px = ctx.getImageData(0, 0, SIZE, SIZE).data;
      const n = SIZE * SIZE;
      let rSum=0,gSum=0,bSum=0,exGSum=0,gccSum=0,ngrdiSum=0;
      let deepGreen=0,richGreen=0,midGreen=0,lightGreen=0,paleGreen=0,yellowGreen=0,brown=0,shadow=0,grey=0,white=0;
      let greenLumSum=0,greenCount=0,greenLumSqSum=0;
      for (let i=0;i<px.length;i+=4) {
        const r=px[i],g=px[i+1],b=px[i+2];
        const lum=0.299*r+0.587*g+0.114*b,sat=Math.max(r,g,b)-Math.min(r,g,b),sum3=r+g+b+0.001;
        rSum+=r;gSum+=g;bSum+=b;
        const exG=2*g-r-b,gcc=g/sum3,ngrdi=(g-r)/(g+r+0.001);
        exGSum+=exG;gccSum+=gcc;ngrdiSum+=ngrdi;
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
        let hue=0;
        if(d>0){if(mx===r)hue=((g-b)/d)%6;else if(mx===g)hue=(b-r)/d+2;else hue=(r-g)/d+4;hue*=60;if(hue<0)hue+=360;}
        if(lum>238){white++;continue;}
        if(sat<16&&lum>50&&lum<215){grey++;continue;}
        if(lum<32){shadow++;continue;}
        const isGH=hue>=55&&hue<=170,isGD=g>r&&g>b&&exG>5;
        if(isGH||isGD){
          greenLumSum+=lum;greenLumSqSum+=lum*lum;greenCount++;
          if(lum<110&&exG>35&&hue>=80&&hue<=150&&sat>30){deepGreen++;continue;}
          if(lum>=90&&lum<150&&exG>25&&hue>=75&&hue<=155&&sat>22){richGreen++;continue;}
          if(lum>=125&&lum<185&&exG>12&&hue>=70&&hue<=160&&sat>14){midGreen++;continue;}
          if(lum>=165&&lum<225&&hue>=65&&hue<=160&&sat>10){lightGreen++;continue;}
          if(lum>=200&&exG>3&&sat>6){paleGreen++;continue;}
          if(hue>=40&&hue<75&&lum>100&&sat>15){yellowGreen++;continue;}
        }
        if(hue>=15&&hue<50&&r>g&&r>b&&lum>38&&lum<195&&sat>8){brown++;continue;}
      }
      const dP=deepGreen/n,rP=richGreen/n,mP=midGreen/n,lP=lightGreen/n;
      const pP=paleGreen/n,yP=yellowGreen/n,bP=brown/n,dkP=shadow/n,grP=grey/n,whP=white/n;
      const grassTotal=dP+rP+mP+lP+pP+yP;
      const avgG=gSum/n,avgR=rSum/n,avgB=bSum/n;
      const avgExG=exGSum/n,avgGCC=gccSum/n,avgNGRDI=ngrdiSum/n;
      const pD=grassTotal>=0.12&&(avgExG>6||avgGCC>0.36);
      const dkD=dkP>0.15&&avgG>avgR&&avgG>avgB*0.95;
      const wD=avgG-avgR>3&&avgGCC>0.33&&grP+whP<0.30;
      if(!pD&&!dkD&&!wD){resolve({grassDetected:false,grassPct:Math.round(grassTotal*100)});return;}
      const gMean=greenCount?greenLumSum/greenCount:0;
      const gVar=greenCount?(greenLumSqSum/greenCount)-gMean*gMean:0;
      const gStd=Math.sqrt(Math.max(0,gVar));
      const uniformity=Math.max(0,1-gStd/60);
      const isLawn=mP>0.28&&dP<0.08&&dkP<0.06&&bP<0.08&&uniformity>0.45&&avgGCC>0.36;
      const isFescue=!isLawn&&dP>0.15&&dkP>0.08&&rP>0.15&&lP<0.12;
      const isKikuyu=!isLawn&&lP>0.25&&dP<0.10&&mP>0.20&&yP<0.15;
      const swardType=isLawn?'lawn':isFescue?'fescue':isKikuyu?'kikuyu':'ryegrass';
      let vh;
      if(isLawn) vh=2+mP*5+lP*6+yP*4+pP*3;
      else if(isKikuyu) vh=3+dP*20+rP*14+mP*9+lP*6+yP*5+dkP*9;
      else{const sg=0.5+Math.min(1,dkP/0.10)*0.5;vh=(dP*28+rP*17)*sg+mP*11+lP*5+pP*3+yP*7+dkP*13+bP*1+Math.max(0,avgG-avgR)/5;}
      const heightCm=Math.max(2,Math.min(40,Math.round(vh)));
      const cR=isLawn?1.5:isFescue?3.0:isKikuyu?3.2:2.7;
      const compressedCm=Math.max(0.3,heightCm/cR);
      const cloverPresent=!isLawn&&lP>0.08&&yP<0.22&&rP>0.08;
      const postGrazing=heightCm<=8||(bP>0.18&&heightCm<12);
      const leafStage=isLawn?'Mown':heightCm<=6?'Residual':heightCm<=10?'1.0':heightCm<=14?'1.5–2.0':heightCm<=18?'2.0–2.5':heightCm<=24?'2.5–3.0':'3.0+';
      const dV=dP+rP;
      const quality=isLawn?'Lawn':(dV>0.45&&bP<0.08&&yP<0.12)?'High':(dV>0.22||mP>0.32)?'Medium':'Low';
      const growthRate=isLawn?0:Math.max(15,Math.min(180,Math.round(40+dP*170+rP*95+mP*40-yP*55-bP*35)));
      const confidence=(grassTotal>0.60&&avgExG>25&&gStd<35)?'high':(grassTotal>0.35&&avgExG>12)?'medium':'low';
      resolve({grassDetected:true,swardType,isLikelyLawn:isLawn,heightCm,compressedCm,quality,leafStage,cloverPresent,postGrazing,greenPct:Math.round(grassTotal*100),brownPct:Math.round(bP*100),deepPct:dP,richPct:rP,midPct:mP,lightPct:lP,yellowPct:yP,shadowPct:dkP,avgExG,avgGCC,avgNGRDI,uniformity:Math.round(uniformity*100)/100,growthRate,confidence});
    };
    img.onerror=()=>resolve({grassDetected:false,grassPct:0});
    img.src=dataUrl;
  });
}

function computeResult(stats, season) {
  const {heightCm,compressedCm,quality,leafStage,cloverPresent,postGrazing,isLikelyLawn,swardType,greenPct,brownPct,deepPct,richPct,yellowPct,avgNGRDI,growthRate,confidence,uniformity}=stats;
  const baseK=swardType==='lawn'?170:swardType==='fescue'?260:swardType==='kikuyu'?230:280;
  const sF=season.label==='Winter'?0.90:season.label==='Summer'?1.05:1.00;
  const k=baseK*sF,bi=isLikelyLawn?200:500;
  let kg=compressedCm*k+bi;
  const dAdj=deepPct*400+richPct*180,sAdj=yellowPct*-380,bAdj=(brownPct/100)*-320,cAdj=cloverPresent?60:0;
  const cAdjTotal=isLikelyLawn?0:dAdj+sAdj+bAdj+cAdj;
  const mA=kg*0.15;
  kg+=Math.max(-mA,Math.min(mA,cAdjTotal));
  if(!isLikelyLawn){
    const nb=Math.max(0,avgNGRDI)*6000+500;
    const gc=Math.max(0.6,Math.min(1.15,(greenPct/100)/0.75));
    kg=(kg*0.35)+(nb*gc*0.65)-yellowPct*400-(brownPct/100)*350+(cloverPresent?80:0);
  }
  kg=Math.round(Math.max(isLikelyLawn?200:500,Math.min(5500,kg)));
  let notes,recommendation;
  const sp=swardType==='fescue'?'Tall fescue paddock: ':swardType==='kikuyu'?'Kikuyu paddock: ':'';
  if(isLikelyLawn){
    const ld=heightCm<=3?'freshly mown':heightCm<=5?'well-maintained':'unmown';
    notes=`Lawn detected (${ld}, ~${heightCm} cm, ${greenPct}% green cover). DM equivalent: ~${kg.toLocaleString()} kg DM/ha.`;
    recommendation='For accurate dairy pasture readings, photograph actual farm paddocks from 1 m height, straight down.';
  } else if(kg<1500){
    notes=`${sp}Pasture is ${kg<1000?'severely overgrazed':'below residual target'} at ~${heightCm} cm visual (${compressedCm.toFixed(1)} cm compressed) with ${greenPct}% green cover. DairyNZ target post-grazing residual is 1,500-1,650 kg DM/ha.`;
    recommendation=kg<1000?'Critical — remove stock immediately. Rest minimum 18-20 days.':'Remove cows now. Rest this paddock and prioritise higher-cover paddocks.';
  } else if(kg<2000){
    const d=Math.round((2500-kg)/Math.max(growthRate,20));
    notes=`${sp}Pasture rebuilding at ~${heightCm} cm visual, ${greenPct}% green cover. At ${kg.toLocaleString()} kg DM/ha. Estimated ${d} days to reach ideal pre-grazing cover.`;
    recommendation='Continue resting — not ready to graze. Target minimum 2,200 kg DM/ha before re-entry.';
  } else if(kg<2800){
    notes=`${sp}Good ${season.label.toLowerCase()} cover at ~${heightCm} cm visual, ${leafStage} leaf stage, ${greenPct}% green.${cloverPresent?' White clover visible.':''}`;
    recommendation=kg<2400?'Almost ready — graze within 3-5 days.':(cloverPresent?'Excellent ryegrass/clover mix. Graze within 1-2 days. Target 1,500-1,650 kg DM/ha residual.':'Good cover — graze within 2-3 days. Target 1,500-1,650 kg DM/ha residual.');
  } else if(kg<3500){
    notes=`${sp}Pre-grazing yield ~${kg.toLocaleString()} kg DM/ha at ${heightCm} cm. Ideal pre-grazing range for 16-18 kg DM/cow/day.`;
    recommendation=cloverPresent?'High-quality paddock. Graze immediately. Clover will maximise milksolids response.':'Graze immediately — covers above 3,200 kg DM/ha risk quality loss.';
  } else {
    notes=`${sp}Surplus at ~${heightCm} cm (${kg.toLocaleString()} kg DM/ha) — above 3,500 kg DM/ha threshold. Feed quality deteriorating.`;
    recommendation='Act immediately — remove as silage or allocate to highest-producing cows.';
  }
  return {kgDMperHa:kg,heightCm,confidence,quality,leafStage,cloverPresent,postGrazing,isLikelyLawn,swardType,notes,recommendation,growthRate};
}

// ── Colours ───────────────────────────────────────────────────────────────────
const C={bg:'#f2f2f7',card:'#fff',text:'#111',textSec:'#6b7280',textTert:'#9ca3af',green:'#1a5c3a',greenLight:'#e8f5ee',border:'#e5e7eb',redLight:'#fef2f2'};

// ── Video helpers ─────────────────────────────────────────────────────────────
function extractVideoFrames(videoUrl,numFrames=8){return new Promise((resolve,reject)=>{
  const video=document.createElement('video');
  video.muted=true;video.playsInline=true;video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.preload='auto';
  video.style.cssText='position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0';
  document.body.appendChild(video);
  let resolved=false;
  const cleanup=()=>{try{video.pause();}catch(_){}try{video.removeAttribute('src');video.load();}catch(_){}try{document.body.removeChild(video);}catch(_){}};
  const finish=r=>{if(resolved)return;resolved=true;cleanup();resolve(r);};
  const fail=e=>{if(resolved)return;resolved=true;cleanup();reject(e);};
  const ot=setTimeout(()=>fail(new Error('Video timeout')),25000);
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  const frames=[],times=[];let dur=0;
  const captureFrame=idx=>{try{const w=video.videoWidth||640,hh=video.videoHeight||480;if(w<50||hh<50)return false;if(canvas.width!==480){const sc=480/w;canvas.width=480;canvas.height=Math.round(hh*sc);}ctx.drawImage(video,0,0,canvas.width,canvas.height);const u=canvas.toDataURL('image/jpeg',0.82);if(u.length>2000){frames.push({url:u,angleDeg:Math.round((idx/Math.max(1,numFrames-1))*180),time:video.currentTime});return true;}}catch(_){}return false;};
  const monitor=()=>{let fi=0;const loop=()=>{if(resolved)return;while(fi<times.length&&video.currentTime>=times[fi]){captureFrame(fi);fi++;}if(fi>=numFrames||video.ended||video.currentTime>=dur*0.98){while(fi<numFrames){captureFrame(fi);fi++;}clearTimeout(ot);frames.length>0?finish({frames,dur}):fail(new Error('No frames'));return;}requestAnimationFrame(loop);};requestAnimationFrame(loop);};
  video.onloadedmetadata=()=>{dur=video.duration;if(!dur||!isFinite(dur)||dur<0.1){setTimeout(()=>{captureFrame(0)?finish({frames,dur:dur||1}):fail(new Error('No dur'));},500);return;}const st=dur*0.05,et=dur*0.95;for(let i=0;i<numFrames;i++)times.push(st+(et-st)*(numFrames===1?0.5:i/(numFrames-1)));};
  video.onloadeddata=()=>{const p=video.play();if(p)p.then(()=>monitor()).catch(()=>{setTimeout(()=>{captureFrame(0)?finish({frames,dur:dur||1}):fail(new Error('Play failed'));},300);});else monitor();};
  video.onerror=()=>fail(new Error('Video error'));
  video.onended=()=>{if(!resolved&&frames.length>0){clearTimeout(ot);finish({frames,dur});}};
  video.src=videoUrl;video.load();
});}

function aggregateFrameStats(arr){
  const valid=arr.filter(s=>s&&s.grassDetected);
  if(!valid.length)return{grassDetected:false,grassPct:(arr.find(s=>s)||{grassPct:0}).grassPct};
  const avg=k=>valid.reduce((s,x)=>s+(x[k]||0),0)/valid.length;
  const median=k=>{const so=valid.map(x=>x[k]||0).sort((a,b)=>a-b),m=Math.floor(so.length/2);return so.length%2?so[m]:(so[m-1]+so[m])/2;};
  const mode=k=>{const co={};valid.forEach(v=>{co[v[k]]=(co[v[k]]||0)+1;});return Object.keys(co).reduce((a,b)=>co[a]>co[b]?a:b);};
  const hs=valid.map(v=>v.heightCm),hm=hs.reduce((s,x)=>s+x,0)/hs.length;
  const hStd=Math.sqrt(hs.reduce((s,x)=>s+Math.pow(x-hm,2),0)/hs.length);
  const vp=hStd>4?1:hStd>2?2:3;
  const ct=valid.reduce((s,x)=>s+(x.confidence==='high'?3:x.confidence==='medium'?2:1),0)/valid.length;
  const fc=Math.min(ct,vp);
  return{grassDetected:true,swardType:mode('swardType'),isLikelyLawn:valid.filter(v=>v.isLikelyLawn).length>valid.length/2,heightCm:Math.round(median('heightCm')),compressedCm:median('heightCm')/2.7,quality:mode('quality'),leafStage:mode('leafStage'),cloverPresent:valid.filter(v=>v.cloverPresent).length>valid.length/2,postGrazing:valid.filter(v=>v.postGrazing).length>valid.length/2,greenPct:Math.round(avg('greenPct')),brownPct:Math.round(avg('brownPct')),deepPct:avg('deepPct'),richPct:avg('richPct'),midPct:avg('midPct'),lightPct:avg('lightPct'),yellowPct:avg('yellowPct'),shadowPct:avg('shadowPct'),avgExG:avg('avgExG'),avgGCC:avg('avgGCC'),avgNGRDI:avg('avgNGRDI'),uniformity:avg('uniformity'),growthRate:Math.round(avg('growthRate')),confidence:fc>=2.5?'high':fc>=1.5?'medium':'low',framesAnalysed:valid.length,heightStdDev:Math.round(hStd*10)/10,spatialVariance:hStd>4?'high':hStd>2?'moderate':'low'};
}

// ── Tiny style helpers ────────────────────────────────────────────────────────
const btn=(extra={})=>({border:'none',cursor:'pointer',fontFamily:'inherit',...extra});
const card=(extra={})=>({background:C.card,borderRadius:16,boxShadow:'0 1px 3px rgba(0,0,0,0.07)',...extra});

// ── Main App ──────────────────────────────────────────────────────────────────
function PastureScan() {
  const [screen,setScreen]=useState('home');
  const [capturedImage,setCapturedImage]=useState(null);
  const [result,setResult]=useState(null);
  const [noGrass,setNoGrass]=useState(null);
  const [season,setSeason]=useState(getCurrentSeason);
  const [history,setHistory]=useState(()=>{try{return JSON.parse(localStorage.getItem('ps_history')||'[]');}catch(e){return [];}});
  const [activeTab,setActiveTab]=useState('metrics');
  const [progress,setProgress]=useState(0);
  const [step,setStep]=useState(0);
  const [showSeason,setShowSeason]=useState(false);
  const [paddockName,setPaddockName]=useState('');
  const [viewingReading,setViewingReading]=useState(null);
  const [editingName,setEditingName]=useState(false);
  const [editNameVal,setEditNameVal]=useState('');
  const [user,setUser]=useState(()=>{try{const u=localStorage.getItem('ps_user');return u?JSON.parse(u):null;}catch(e){return null;}});
  const [authScreen,setAuthScreen]=useState(null);
  const [authMode,setAuthMode]=useState('login');
  const [authForm,setAuthForm]=useState({name:'',email:'',password:'',farmName:''});
  const [authError,setAuthError]=useState('');
  const [authLoading,setAuthLoading]=useState(false);
  const [shareCode,setShareCode]=useState(null);
  const [importCode,setImportCode]=useState('');
  const [importResult,setImportResult]=useState(null);
  const seasonRef=useRef(season);
  const fileRef=useRef(null);

  useEffect(()=>{
    try{const slim=history.map(r=>({...r,image:null}));localStorage.setItem('ps_history',JSON.stringify(slim));}catch(e){}
  },[history]);
  useEffect(()=>{if(user)localStorage.setItem('ps_user',JSON.stringify(user));else localStorage.removeItem('ps_user');},[user]);

  const setSeasonAndRef=s=>{setSeason(s);seasonRef.current=s;};
  const openCamera=()=>fileRef.current&&fileRef.current.click();

  // ── Auth ──────────────────────────────────────────────────────────────────
  const uKey=email=>'u:'+email.toLowerCase().trim();
  const signup=async()=>{
    setAuthError('');setAuthLoading(true);
    const{name,email,farmName,password}=authForm;
    if(!name.trim()||!email.trim()||!password.trim()){setAuthError('Please fill in all fields.');setAuthLoading(false);return;}
    if(!/^[^@]+@[^@]+\.[^@]+$/.test(email)){setAuthError('Enter a valid email address.');setAuthLoading(false);return;}
    if(password.length<6){setAuthError('Password must be at least 6 characters.');setAuthLoading(false);return;}
    const existing=window._storage.get(uKey(email));
    if(existing){setAuthError('An account with this email already exists.');setAuthLoading(false);return;}
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2);
    const u={id,name:name.trim(),email:email.toLowerCase().trim(),farmName:farmName.trim(),ph:btoa(password)};
    window._storage.set(uKey(email),JSON.stringify(u));
    setUser(u);setAuthScreen(null);setAuthForm({name:'',email:'',password:'',farmName:''});
    setAuthLoading(false);
  };
  const login=async()=>{
    setAuthError('');setAuthLoading(true);
    const{email,password}=authForm;
    if(!email.trim()||!password.trim()){setAuthError('Enter your email and password.');setAuthLoading(false);return;}
    const stored=window._storage.get(uKey(email));
    if(!stored){setAuthError('No account found with this email.');setAuthLoading(false);return;}
    const u=JSON.parse(stored.value);
    if(u.ph!==btoa(password)){setAuthError('Incorrect password.');setAuthLoading(false);return;}
    setUser(u);setAuthScreen(null);setAuthForm({name:'',email:'',password:'',farmName:''});
    setAuthLoading(false);
  };
  const logout=()=>{setUser(null);setAuthScreen(null);};

  const generateShareCode=()=>{
    if(!history.length)return;
    const slim=history.map(r=>({id:r.id,paddock:r.paddock,date:r.date,time:r.time,season:r.season,kgDMperHa:r.result.kgDMperHa,heightCm:r.result.heightCm,leafStage:r.result.leafStage,quality:r.result.quality,cloverPresent:r.result.cloverPresent,confidence:r.result.confidence,growthRate:r.result.growthRate}));
    const farm=user?(user.farmName||user.name):'Farm';
    const raw=JSON.stringify({farm,exported:new Date().toLocaleDateString('en-NZ'),readings:slim});
    const b64=btoa(encodeURIComponent(raw).replace(/%([0-9A-F]{2})/g,(_,p)=>String.fromCharCode(parseInt(p,16))));
    const code=b64.replace(/[^A-Z0-9]/gi,'').slice(0,20).toUpperCase();
    window._storage.set('share:'+code,raw);setShareCode(code);
  };
  const importFromCode=()=>{
    const code=importCode.trim().toUpperCase();if(!code)return;setImportResult(null);
    const stored=window._storage.get('share:'+code);
    if(!stored){setImportResult({success:false,error:'Code not found.'});return;}
    try{
      const payload=JSON.parse(stored.value);
      const imported=payload.readings.map(r=>({id:r.id||Date.now()+Math.random(),paddock:r.paddock||'Imported',date:r.date,time:r.time||'',season:r.season||'',image:null,result:{kgDMperHa:r.kgDMperHa,heightCm:r.heightCm,leafStage:r.leafStage,quality:r.quality,cloverPresent:r.cloverPresent||false,confidence:r.confidence||'medium',growthRate:r.growthRate||80,notes:'',recommendation:'',postGrazing:false}}));
      setHistory(prev=>{const ids=new Set(prev.map(x=>x.id));return[...imported.filter(x=>!ids.has(x.id)),...prev].sort((a,b)=>b.id-a.id);});
      setImportResult({success:true,count:imported.length,farm:payload.farm});
    }catch(e){setImportResult({success:false,error:'Invalid code.'});}
  };

  const exportReport=()=>{
    const farm=user?(user.farmName||user.name):'Farm';
    const rows=history.map(h=>{const cat=getDMCat(h.result.kgDMperHa);return`<tr><td>${h.paddock}</td><td>${h.date}</td><td>${h.season}</td><td style="font-weight:700;color:${cat.color}">${h.result.kgDMperHa.toLocaleString()}</td><td>${h.result.heightCm} cm</td><td>${h.result.leafStage}</td><td>${h.result.quality}</td><td>${h.result.cloverPresent?'Yes':'No'}</td><td>${h.result.growthRate}</td><td>${Math.round(h.result.kgDMperHa/17)}</td></tr>`;}).join('');
    const ds=new Date().toLocaleDateString('en-NZ');
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>PastureScan Report</title><style>body{font-family:-apple-system,sans-serif;padding:24px;color:#111}h1{color:#1a5c3a;font-size:22px}h2{font-size:13px;color:#6b7280;font-weight:400;margin-bottom:24px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1a5c3a;color:#fff;padding:10px 8px;text-align:left}td{padding:9px 8px;border-bottom:1px solid #e5e7eb}tr:nth-child(even) td{background:#f9fafb}</style></head><body><h1>PastureScan — Pasture Cover Report</h1><h2>${farm} · ${history.length} readings · ${ds}</h2><table><thead><tr><th>Paddock</th><th>Date</th><th>Season</th><th>kg DM/ha</th><th>Height</th><th>Leaf Stage</th><th>Quality</th><th>Clover</th><th>Growth Rate</th><th>Cow-days/ha</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
    const blob=new Blob([html],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`PastureScan-${ds.replace(/\//g,'-')}.html`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  // ── Analysis ──────────────────────────────────────────────────────────────
  const runAnalysis=useCallback(async url=>{
    setNoGrass(null);setResult(null);setScreen('analyzing');setProgress(0);setStep(0);
    const cur=seasonRef.current,delay=ms=>new Promise(r=>setTimeout(r,ms));
    setStep(0);setProgress(15);await delay(350);setStep(1);setProgress(40);
    const stats=await analysePixels(url);
    await delay(300);setStep(2);setProgress(72);await delay(300);
    setStep(3);setProgress(92);await delay(200);setProgress(100);await delay(200);
    if(!stats.grassDetected){setNoGrass({grassPct:stats.grassPct});setScreen('no-grass');}
    else{setResult(computeResult(stats,cur));setActiveTab('metrics');setScreen('result');}
  },[]);

  const runVideoAnalysis=useCallback(async videoUrl=>{
    setNoGrass(null);setResult(null);setScreen('analyzing');setProgress(0);setStep(0);
    const cur=seasonRef.current,delay=ms=>new Promise(r=>setTimeout(r,ms));
    try{
      setStep(0);setProgress(10);await delay(300);setStep(1);setProgress(25);
      let fr;
      try{fr=await extractVideoFrames(videoUrl,8);}catch(e){setNoGrass({grassPct:0,error:"Couldn't process the video. Try a single photo instead."});setScreen('no-grass');return;}
      const{frames}=fr;
      if(!frames||!frames.length){setNoGrass({grassPct:0,error:"Couldn't extract frames. Please try again."});setScreen('no-grass');return;}
      setCapturedImage(frames[Math.floor(frames.length/2)].url);
      setStep(2);setProgress(50);
      const fs=[];for(let i=0;i<frames.length;i++){fs.push(await analysePixels(frames[i].url));setProgress(50+Math.round((i+1)/frames.length*35));}
      setStep(3);setProgress(92);await delay(250);
      const combined=aggregateFrameStats(fs);
      setProgress(100);await delay(200);
      if(!combined.grassDetected){setNoGrass({grassPct:combined.grassPct,error:`Only ${combined.grassPct}% green pixels detected. Ensure lens points at grass.`});setScreen('no-grass');}
      else{const r=computeResult(combined,cur);r.framesAnalysed=combined.framesAnalysed;r.spatialVariance=combined.spatialVariance;r.heightStdDev=combined.heightStdDev;r.isVideo=true;setResult(r);setActiveTab('metrics');setScreen('result');}
    }catch(e){setNoGrass({grassPct:0,error:'Something went wrong. Please try again.'});setScreen('no-grass');}
  },[]);

  const handleFile=useCallback(e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;e.target.value='';
    const isVideo=file.type.startsWith('video/');
    const reader=new FileReader();
    reader.onload=ev=>{const url=ev.target.result;setCapturedImage(url);if(isVideo)runVideoAnalysis(url);else runAnalysis(url);};
    reader.readAsDataURL(file);
  },[runAnalysis,runVideoAnalysis]);

  const saveReading=useCallback(()=>{
    if(!result)return;
    const newR={id:Date.now(),paddock:paddockName.trim()||'Reading '+(history.length+1),date:new Date().toLocaleDateString('en-NZ'),time:new Date().toLocaleTimeString('en-NZ',{hour:'2-digit',minute:'2-digit'}),image:null,result,season:season.label};
    setHistory(prev=>[newR,...prev.slice(0,49)]);
    setPaddockName('');setResult(null);setCapturedImage(null);setScreen('home');
  },[result,paddockName,season,history]);

  // ── File input ────────────────────────────────────────────────────────────
  const fileInput=h('input',{ref:fileRef,type:'file',accept:'video/*,image/*',capture:'environment',style:{display:'none'},onChange:handleFile});

  // ── AUTH SCREEN ───────────────────────────────────────────────────────────
  if(authScreen){
    const isAcc=authScreen==='account';
    return h('div',{style:{fontFamily:'inherit',background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto'}},

        h('button',{onClick:()=>{setAuthScreen(null);setAuthError('');setShareCode(null);setImportResult(null);},style:btn({background:'rgba(255,255,255,0.15)',borderRadius:20,padding:'7px 14px',color:'#fff',fontSize:13,fontWeight:600})},'← Back'),
        h('div',{style:{fontSize:16,fontWeight:700,color:'#fff'}},isAcc?'My Account':authMode==='login'?'Sign In':'Create Account'),
        h('div',{style:{width:70}})
      ),
      h('div',{style:{padding:'24px 20px 48px'}},
        isAcc&&user&&h(Fragment,null,
          h('div',{style:{...card(),padding:20,marginBottom:14}},
            h('div',{style:{display:'flex',alignItems:'center',gap:14,marginBottom:16}},
              h('div',{style:{width:52,height:52,borderRadius:26,background:C.green,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}},'👤'),
              h('div',null,
                h('div',{style:{fontSize:18,fontWeight:700,color:C.text}},user.name),
                h('div',{style:{fontSize:13,color:C.textSec}},user.email),

              )
            ),
            h('div',{style:{display:'flex',gap:10}},

                h('div',{style:{fontSize:20,fontWeight:800,color:C.green}},history.length),

              h('div',{style:{flex:1,background:'#f5f5f5',borderRadius:10,padding:10,textAlign:'center'}},

                h('div',{style:{fontSize:11,color:C.textSec}},'Avg kg DM/ha')
              )
            )
          ),
          h('div',{style:{...card(),padding:'18px 20px',marginBottom:12}},
            h('div',{style:{fontSize:15,fontWeight:700,color:C.text,marginBottom:4}},'📤 Share Readings'),
            h('div',{style:{fontSize:13,color:C.textSec,marginBottom:12}},'Generate a code to share your readings.'),

                  ),
                  h('button',{onClick:()=>setShareCode(null),style:btn({width:'100%',background:'transparent',border:'1.5px solid '+C.border,borderRadius:12,padding:12,color:C.textSec,fontSize:14,fontWeight:600})},'Generate New Code')
                )

          ),
          h('div',{style:{...card(),padding:'18px 20px',marginBottom:12}},

            h('button',{onClick:importFromCode,disabled:!importCode.trim(),style:btn({width:'100%',background:importCode.trim()?C.green:'#ccc',borderRadius:12,padding:14,color:'#fff',fontSize:14,fontWeight:700})},'📥 Import'),

          h('div',{style:{fontSize:14,color:C.textSec,marginBottom:24,lineHeight:1.5}},'Save readings, share with your team, and export reports.'),
          h('button',{onClick:()=>{setAuthScreen('auth');setAuthMode('login');},style:btn({width:'100%',background:C.green,borderRadius:12,padding:'14px 32px',color:'#fff',fontSize:15,fontWeight:700,marginBottom:12})},'Sign In'),

        ),
        authScreen==='auth'&&h('div',{style:{...card(),padding:'24px 20px'}},

            )

            h('input',{value:authForm.email,onChange:e=>setAuthForm(f=>({...f,email:e.target.value})),type:'email',placeholder:'you@example.com',style:{width:'100%',boxSizing:'border-box',padding:'13px 14px',border:'1.5px solid '+C.border,borderRadius:12,fontSize:15,outline:'none',color:C.text}})
          ),

          h('button',{onClick:authMode==='login'?login:signup,disabled:authLoading,style:btn({width:'100%',background:authLoading?'#aaa':C.green,borderRadius:12,padding:16,color:'#fff',fontSize:16,fontWeight:700,marginBottom:14})},authLoading?'Please wait...':authMode==='login'?'Sign In':'Create Account'),

        )
      )
    );
  }

  // ── HOME ──────────────────────────────────────────────────────────────────
  if(screen==='home'){
    const avg=history.length?Math.round(history.reduce((s,hh)=>s+hh.result.kgDMperHa,0)/history.length):null;
    return h('div',{style:{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto'}},
      fileInput,
      h('div',{style:{background:C.green,padding:'52px 20px 18px'}},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
          h('div',{style:{display:'flex',alignItems:'center',gap:10}},
            h('button',{onClick:()=>setAuthScreen('account'),style:btn({background:'rgba(255,255,255,0.15)',borderRadius:20,width:36,height:36,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'})},
              h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},

                h('rect',{x:'4.5',y:6,width:9,height:'1.5',rx:'.75',fill:'white'}),
                h('rect',{x:'4.5',y:'8.25',width:9,height:'1.5',rx:'.75',fill:'white'}),
                h('rect',{x:'4.5',y:'10.5',width:9,height:'1.5',rx:'.75',fill:'white'})
              )
            ),
            h('div',null,
              user&&h('div',{style:{fontSize:12,color:'rgba(255,255,255,0.65)',fontWeight:500,marginBottom:2}},user.farmName||user.name),
              h('div',{style:{fontSize:26,fontWeight:700,color:'#fff',letterSpacing:'-0.5px'}},'PastureScan')
            )
          ),
          h('button',{onClick:()=>setShowSeason(!showSeason),style:btn({background:'rgba(255,255,255,0.15)',borderRadius:20,padding:'7px 14px',color:'#fff',fontSize:13,fontWeight:600})},season.label+' ▾')
        ),
        showSeason&&h('div',{style:{marginTop:12,background:'rgba(255,255,255,0.12)',borderRadius:12,overflow:'hidden'}},
          SEASONS.map(s=>h('button',{key:s.label,onClick:()=>{setSeasonAndRef(s);setShowSeason(false);},style:btn({display:'block',width:'100%',padding:'11px 16px',background:season.label===s.label?'rgba(255,255,255,0.2)':'transparent',borderBottom:'1px solid rgba(255,255,255,0.1)',fontSize:14,fontWeight:600,color:'#fff',textAlign:'left'})},s.label))
        )

      h('div',{style:{display:'flex',background:C.card,borderBottom:'1px solid '+C.border}},
        [{val:history.length,lbl:'Readings'},{val:avg?avg.toLocaleString():'—',lbl:'Avg kg DM/ha'}].map((s,i)=>
          h('div',{key:i,style:{flex:1,padding:'14px 0',textAlign:'center',borderRight:i===0?'1px solid '+C.border:'none'}},
            h('div',{style:{fontSize:22,fontWeight:700,color:C.text}},s.val),

          h('div',{style:{fontSize:12,fontWeight:700,color:C.text,marginBottom:4}},'📐 How to measure'),

        h('div',{style:{fontSize:12,fontWeight:700,color:C.textSec,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}},`Saved Readings (${history.length})`),
        history.map(hh=>{

            h('div',{style:{width:52,height:52,borderRadius:10,background:cat.color+'22',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}},cat.emoji),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontSize:15,fontWeight:700,color:C.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},hh.paddock),
              h('div',{style:{fontSize:12,color:C.textSec,marginTop:2}},hh.date+' · '+hh.season),

            ),
            h('div',{style:{textAlign:'right',flexShrink:0}},
              h('div',{style:{fontSize:22,fontWeight:800,color:cat.color}},hh.result.kgDMperHa.toLocaleString()),
              h('div',{style:{fontSize:10,color:C.textSec}},'kg DM/ha')
            )
          );
        })
      )
    );
  }

  // ── ANALYSING ─────────────────────────────────────────────────────────────
  if(screen==='analyzing'){
    const steps=['Extracting frames from sweep','Measuring canopy at each angle','Aggregating paddock readings','Applying DairyNZ formula'];
    return h('div',{style:{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24,padding:'0 32px'}},
      fileInput,
      capturedImage&&h('img',{src:capturedImage,style:{width:200,height:200,borderRadius:20,objectFit:'cover',boxShadow:'0 8px 32px rgba(0,0,0,0.12)'}}),
      h('div',{style:{textAlign:'center'}},
        h('div',{style:{fontSize:22,fontWeight:700,color:C.text}},'Analysing Sweep'),
        h('div',{style:{fontSize:14,color:C.textSec,marginTop:5}},'Sampling 8 frames · Applying DairyNZ standards')
      ),
      h('div',{style:{width:'100%',height:4,background:'#e5e7eb',borderRadius:2,overflow:'hidden'}},

  // ── NO GRASS ──────────────────────────────────────────────────────────────
  if(screen==='no-grass'){

        capturedImage&&h('img',{src:capturedImage,style:{width:'100%',height:'100%',objectFit:'cover',opacity:0.7}}),
        h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.6)'}}),
        h('button',{onClick:()=>{setCapturedImage(null);setNoGrass(null);setScreen('home');},style:btn({position:'absolute',top:52,left:16,width:40,height:40,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(6px)',borderRadius:20,color:'#fff',fontSize:17})},'←'),
        h('div',{style:{position:'absolute',bottom:16,left:16}},
          h('div',{style:{fontSize:11,color:'rgba(255,255,255,0.8)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}},'Detection result'),
          h('div',{style:{fontSize:28,fontWeight:800,color:'#fff'}},'No Grass Detected')
        )
      ),
      h('div',{style:{background:C.card,borderRadius:'20px 20px 0 0',marginTop:-8,padding:20}},
        h('div',{style:{background:C.redLight,border:'1.5px solid rgba(239,68,68,0.2)',borderRadius:14,padding:16,marginBottom:20,display:'flex',gap:14,alignItems:'flex-start'}},
          h('div',{style:{fontSize:28,flexShrink:0}},'🚫'),
          h('div',null,
            h('div',{style:{fontSize:15,fontWeight:700,color:'#991b1b',marginBottom:4}},'No pasture found in this photo'),
            h('div',{style:{fontSize:13,color:'#b91c1c',lineHeight:1.5}},noGrass&&noGrass.error?noGrass.error:'Please photograph grass from 1 metre above the canopy.')
          )
        ),
        h('div',{style:{background:'#f9fafb',borderRadius:14,padding:16,marginBottom:20}},
          h('div',{style:{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}},'Tips for a good reading'),
          [['🎥','Video sweep','Record 5 seconds while rotating 180° at waist height'],['📍','Position','Hold phone at waist height, lens pointing down at the grass'],['🌿','Framing','Grass should fill the frame — no sky or concrete'],['☀️','Lighting','Works best in natural daylight']].map(([icon,title,desc],i)=>
            h('div',{key:i,style:{display:'flex',gap:12,marginBottom:i<3?12:0}},
              h('div',{style:{fontSize:18,flexShrink:0}},icon),
              h('div',null,h('div',{style:{fontSize:13,fontWeight:600,color:C.text}},title),h('div',{style:{fontSize:12,color:C.textSec,marginTop:2}},desc))
            )
          )
        ),
        h('button',{onClick:()=>{setCapturedImage(null);setNoGrass(null);openCamera();},style:btn({width:'100%',background:C.green,borderRadius:14,padding:17,color:'#fff',fontSize:16,fontWeight:700,marginBottom:10})},'📸 Try Again'),
        h('button',{onClick:()=>{setCapturedImage(null);setNoGrass(null);setScreen('home');},style:btn({width:'100%',background:'transparent',border:'1.5px solid '+C.border,borderRadius:14,padding:15,color:C.textSec,fontSize:15,fontWeight:600})},'Go Home')
      )
    );
  }

  // ── RESULT ────────────────────────────────────────────────────────────────
  if(screen==='result'&&result){
    const cat=getDMCat(result.kgDMperHa),cowDays=Math.round(result.kgDMperHa/17);
    return h('div',{style:{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto'}},
      fileInput,
      h('div',{style:{position:'relative',height:220,overflow:'hidden',background:C.green}},
        capturedImage&&h('img',{src:capturedImage,style:{width:'100%',height:'100%',objectFit:'cover'}}),
        h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0) 40%,rgba(0,0,0,0.6)'}}),
        h('button',{onClick:()=>setScreen('home'),style:btn({position:'absolute',top:52,left:16,width:40,height:40,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(6px)',borderRadius:20,color:'#fff',fontSize:17})},'←'),
        h('div',{style:{position:'absolute',bottom:16,left:16,right:16,display:'flex',alignItems:'flex-end',justifyContent:'space-between'}},
          h('div',null,
            h('div',{style:{fontSize:11,color:'rgba(255,255,255,0.8)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:2}},'Cover detected'),
            h('div',{style:{fontSize:42,fontWeight:800,color:'#fff',letterSpacing:'-1.5px',lineHeight:1}},result.kgDMperHa.toLocaleString()),
            h('div',{style:{fontSize:14,color:'rgba(255,255,255,0.85)',fontWeight:500}},'kg DM / ha')
          ),
          h('div',{style:{background:cat.color,borderRadius:10,padding:'7px 13px'}},
            h('div',{style:{fontSize:12,color:'#fff',fontWeight:700}},cat.emoji+' '+cat.label)
          )
        )
      ),
      h('div',{style:{background:C.card,borderRadius:'20px 20px 0 0',marginTop:-8}},
        h('div',{style:{padding:'18px 20px 0',display:'flex',alignItems:'center',justifyContent:'space-between'}},
          h('input',{value:paddockName,onChange:e=>setPaddockName(e.target.value),placeholder:'Tap to name this reading',style:{fontSize:20,fontWeight:700,color:C.text,border:'none',outline:'none',background:'transparent',flex:1}}),
          h('div',{style:{display:'flex',gap:6,flexShrink:0}},
            result.isVideo&&h('div',{style:{background:'#e0e7ff',borderRadius:8,padding:'4px 10px'}},h('div',{style:{fontSize:11,color:'#4338ca',fontWeight:700}},'🎥 '+result.framesAnalysed+' FRAMES')),
            h('div',{style:{background:C.greenLight,borderRadius:8,padding:'4px 10px'}},h('div',{style:{fontSize:11,color:C.green,fontWeight:700}},result.confidence.toUpperCase()))
          )
        ),
        h('div',{style:{display:'flex',borderBottom:'1px solid '+C.border,marginTop:14,padding:'0 20px'}},
          ['metrics','cover','actions'].map(t=>
            h('button',{key:t,onClick:()=>setActiveTab(t),style:btn({flex:1,padding:'10px 0',background:'transparent',borderBottom:activeTab===t?'2px solid '+C.text:'2px solid transparent',color:activeTab===t?C.text:C.textTert,fontSize:14,fontWeight:activeTab===t?700:500,marginBottom:-1})},
              t==='metrics'?'Metrics':t==='cover'?'Cover':'Actions'
            )
          )
        ),
        activeTab==='metrics'&&h('div',{style:{padding:20}},
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr'}},
            [{lbl:'Cover',val:result.kgDMperHa.toLocaleString(),unit:'kg DM/ha'},{lbl:'Height',val:result.heightCm+'',unit:'cm'},{lbl:'Growth rate',val:result.growthRate+'',unit:'kg DM/ha/d'},{lbl:'Leaf stage',val:result.leafStage,unit:''},{lbl:'Quality',val:result.quality,unit:''},{lbl:'Cow-days/ha',val:cowDays+'',unit:'@ 17 kg DM/cow'}].map((m,i)=>
              h('div',{key:i,style:{padding:'16px 0',borderBottom:i<3?'1px solid '+C.border:'none',borderRight:i%3<2?'1px solid '+C.border:'none',paddingLeft:i%3===0?0:16}},
                h('div',{style:{fontSize:11,color:C.textSec,marginBottom:4,fontWeight:500}},m.lbl),
                h('div',{style:{fontSize:i===0?20:18,fontWeight:800,color:C.text}},m.val),
                h('div',{style:{fontSize:10,color:C.textTert,marginTop:1}},m.unit)
              )
            )
          ),
          h('div',{style:{marginTop:14,display:'flex',gap:10}},
            h('div',{style:{flex:1,background:C.greenLight,borderRadius:12,padding:'12px 14px'}},h('div',{style:{fontSize:11,color:C.green,fontWeight:600,marginBottom:3}},'Clover'),h('div',{style:{fontSize:15,fontWeight:700,color:C.green}},result.cloverPresent?'Present ✓':'Not detected')),
            h('div',{style:{flex:1,background:'#f5f5f5',borderRadius:12,padding:'12px 14px'}},h('div',{style:{fontSize:11,color:C.textSec,fontWeight:600,marginBottom:3}},'Status'),h('div',{style:{fontSize:15,fontWeight:700,color:C.text}},result.postGrazing?'Post-grazing':'Pre-grazing'))
          )
        ),
        activeTab==='cover'&&h('div',{style:{padding:20}},
          h('div',{style:{fontSize:12,color:C.textSec,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:14}},'DairyNZ Grazing Target Ranges'),
          DM_RANGES.map((r,i)=>{
            const isActive=result.kgDMperHa>=r.min&&result.kgDMperHa<r.max;
            const barPct=isActive?Math.min(100,Math.max(5,(result.kgDMperHa-r.min)/(r.max-r.min)*100)):0;
            return h('div',{key:i,style:{marginBottom:14,background:isActive?'#f9fafb':'transparent',borderRadius:12,padding:isActive?12:'0 4px'}},
              h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:5}},
                h('div',{style:{display:'flex',alignItems:'center',gap:7}},
                  h('div',{style:{width:8,height:8,borderRadius:3,background:r.color}}),
                  h('span',{style:{fontSize:13,fontWeight:isActive?700:500,color:isActive?C.text:C.textSec}},r.label),
                  isActive&&h('span',{style:{fontSize:10,background:C.greenLight,color:C.green,borderRadius:5,padding:'2px 7px',fontWeight:700}},'you are here')
                ),
                h('span',{style:{fontSize:12,color:C.textSec}},r.min.toLocaleString()+'–'+(r.max===5000?'5,000+':r.max.toLocaleString()))
              ),
              h('div',{style:{height:5,background:'#f0f0f0',borderRadius:3,overflow:'hidden'}},
                h('div',{style:{width:barPct+'%',height:'100%',background:r.color,borderRadius:3,transition:'width 0.6s ease'}})
              ),
              isActive&&h('div',{style:{fontSize:11,color:C.textSec,marginTop:5}},r.target)
            );
          }),
          h('div',{style:{background:'#f9fafb',borderRadius:12,padding:'14px 16px',marginTop:4}},
            h('div',{style:{fontSize:12,fontWeight:700,color:C.text,marginBottom:6}},'Assessment'),
            h('div',{style:{fontSize:13,color:C.textSec,lineHeight:1.55}},result.notes)
          )
        ),
        activeTab==='actions'&&h('div',{style:{padding:'20px 20px 0'}},
          h('div',{style:{background:C.greenLight,borderRadius:14,padding:16,marginBottom:14}},
            h('div',{style:{fontSize:11,color:C.green,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:7}},'DairyNZ Recommendation'),
            h('div',{style:{fontSize:15,color:C.green,fontWeight:600,lineHeight:1.5}},result.recommendation)
          ),
          h('div',{style:{background:'#f9fafb',borderRadius:14,padding:16}},
            h('div',{style:{fontSize:13,fontWeight:700,color:C.text,marginBottom:10}},'Calculation details'),
            [['Season',season.label],['Residual target','1,500–1,600 kg DM/ha'],['Pre-grazing target','2,800–3,200 kg DM/ha']].map(([k,v],i)=>
              h('div',{key:i,style:{display:'flex',justifyContent:'space-between',marginBottom:i<2?8:0}},
                h('span',{style:{fontSize:13,color:C.textSec}},k),
                h('span',{style:{fontSize:13,fontWeight:600,color:C.text}},v)
              )
            )
          )
        ),
        h('div',{style:{padding:'16px 20px 36px',marginTop:4}},
          h('button',{onClick:saveReading,style:btn({width:'100%',background:C.green,borderRadius:14,padding:17,color:'#fff',fontSize:16,fontWeight:700,boxShadow:'0 4px 16px rgba(26,92,58,0.22)',marginBottom:10,display:'flex',alignItems:'center',justifyContent:'center',gap:8})},'💾 Save Reading'),
          h('button',{onClick:()=>{setCapturedImage(null);setResult(null);openCamera();},style:btn({width:'100%',background:'transparent',border:'1.5px solid '+C.border,borderRadius:14,padding:15,color:C.textSec,fontSize:15,fontWeight:600})},'📸 Take Another')
        )
      )
    );
  }

  // ── READING DETAIL ────────────────────────────────────────────────────────
  if(screen==='reading-detail'&&viewingReading){
    const hh=viewingReading,cat=getDMCat(hh.result.kgDMperHa),r=hh.result,cowDays=Math.round(r.kgDMperHa/17);
    const saveName=()=>{const t=editNameVal.trim();if(!t)return;const up={...hh,paddock:t};setHistory(prev=>prev.map(item=>item.id===hh.id?up:item));setViewingReading(up);setEditingName(false);};
    return h('div',{style:{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto'}},
      fileInput,
      h('div',{style:{position:'relative',height:220,overflow:'hidden',background:C.green}},
        h('div',{style:{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,0.35),rgba(0,0,0,0) 45%,rgba(0,0,0,0.6)'}}),
        h('button',{onClick:()=>{setViewingReading(null);setScreen('home');},style:btn({position:'absolute',top:52,left:16,width:40,height:40,background:'rgba(0,0,0,0.45)',backdropFilter:'blur(6px)',borderRadius:20,color:'#fff',fontSize:17})},'←'),
        h('div',{style:{position:'absolute',bottom:16,left:16,right:16,display:'flex',alignItems:'flex-end',justifyContent:'space-between'}},
          h('div',null,
            h('div',{style:{fontSize:11,color:'rgba(255,255,255,0.75)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:2}},hh.date+' · '+hh.season),
            h('div',{style:{fontSize:38,fontWeight:800,color:'#fff',letterSpacing:'-1px',lineHeight:1}},r.kgDMperHa.toLocaleString()),
            h('div',{style:{fontSize:13,color:'rgba(255,255,255,0.85)',fontWeight:500}},'kg DM / ha')
          ),
          h('div',{style:{background:cat.color,borderRadius:10,padding:'7px 13px'}},h('div',{style:{fontSize:12,color:'#fff',fontWeight:700}},cat.emoji+' '+cat.label))
        )
      ),
      h('div',{style:{background:C.card,borderRadius:'20px 20px 0 0',marginTop:-8}},
        h('div',{style:{padding:'18px 20px 16px',display:'flex',alignItems:'center',gap:10,borderBottom:'1px solid '+C.border}},
          editingName
            ?h(Fragment,null,
                h('input',{autoFocus:true,value:editNameVal,onChange:e=>setEditNameVal(e.target.value),onKeyDown:e=>e.key==='Enter'&&saveName(),style:{flex:1,fontSize:19,fontWeight:700,color:C.text,border:'none',borderBottom:'2px solid '+C.green,outline:'none',background:'transparent',padding:'2px 0'}}),
                h('button',{onClick:saveName,style:btn({background:C.green,borderRadius:10,padding:'8px 16px',color:'#fff',fontSize:13,fontWeight:700})},'Save'),
                h('button',{onClick:()=>setEditingName(false),style:btn({background:'#f0f0f0',borderRadius:10,padding:'8px 12px',color:C.textSec,fontSize:13})},'Cancel')
              )
            :h(Fragment,null,
                h('div',{style:{flex:1,fontSize:19,fontWeight:700,color:C.text}},hh.paddock),
                h('button',{onClick:()=>{setEditNameVal(hh.paddock);setEditingName(true);},style:btn({background:'#f0f0f0',borderRadius:10,padding:'8px 14px',color:C.textSec,fontSize:13,fontWeight:600})},'✏️ Edit')
              )
        ),
        h('div',{style:{padding:'16px 20px 0'}},
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr'}},
            [{lbl:'Cover',val:r.kgDMperHa.toLocaleString(),unit:'kg DM/ha'},{lbl:'Height',val:r.heightCm+'',unit:'cm'},{lbl:'Growth rate',val:r.growthRate+'',unit:'kg DM/ha/d'},{lbl:'Leaf stage',val:r.leafStage,unit:''},{lbl:'Quality',val:r.quality,unit:''},{lbl:'Cow-days/ha',val:cowDays+'',unit:'@ 17 kg DM'}].map((m,i)=>
              h('div',{key:i,style:{padding:'14px 0',borderBottom:i<3?'1px solid '+C.border:'none',borderRight:i%3<2?'1px solid '+C.border:'none',paddingLeft:i%3===0?0:14}},
                h('div',{style:{fontSize:11,color:C.textSec,marginBottom:3}},m.lbl),
                h('div',{style:{fontSize:i===0?18:16,fontWeight:800,color:C.text}},m.val),
                h('div',{style:{fontSize:10,color:C.textTert}},m.unit)
              )
            )
          )
        ),
        h('div',{style:{padding:'14px 20px',display:'flex',gap:8}},
          [{bg:r.cloverPresent?C.greenLight:'#f5f5f5',lbl:'Clover',val:r.cloverPresent?'Present ✓':'Not detected',c:r.cloverPresent?C.green:C.text},{bg:'#f5f5f5',lbl:'Status',val:r.postGrazing?'Post-grazing':'Pre-grazing',c:C.text},{bg:C.greenLight,lbl:'Confidence',val:(r.confidence||'').toUpperCase(),c:C.green}].map((p,i)=>
            h('div',{key:i,style:{flex:1,background:p.bg,borderRadius:10,padding:'8px 10px'}},
              h('div',{style:{fontSize:10,color:p.c,fontWeight:600,opacity:0.7}},p.lbl),
              h('div',{style:{fontSize:12,fontWeight:700,color:p.c,marginTop:2}},p.val)
            )
          )
        ),
        h('div',{style:{margin:'0 20px 12px',background:'#f9fafb',borderRadius:14,padding:'14px 16px'}},
          h('div',{style:{fontSize:12,fontWeight:700,color:C.text,marginBottom:6}},'Assessment'),
          h('div',{style:{fontSize:13,color:C.textSec,lineHeight:1.55}},r.notes)
        ),
        h('div',{style:{margin:'0 20px',background:C.greenLight,borderRadius:14,padding:'14px 16px',marginBottom:14}},
          h('div',{style:{fontSize:11,color:C.green,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}},'DairyNZ Recommendation'),
          h('div',{style:{fontSize:13,color:C.green,fontWeight:600,lineHeight:1.5}},r.recommendation)
        ),
        h('div',{style:{padding:'4px 20px 40px'}},
          h('button',{onClick:()=>{setHistory(prev=>prev.filter(item=>item.id!==hh.id));setViewingReading(null);setScreen('home');},style:btn({width:'100%',background:'transparent',border:'1.5px solid #fee2e2',borderRadius:14,padding:14,color:'#dc2626',fontSize:14,fontWeight:600})},'Delete Reading')
        )
      )
    );
  }

  return h('div',null,fileInput);
}

createRoot(document.getElementById('root')).render(h(PastureScan));
</script>
</body>
</html>
